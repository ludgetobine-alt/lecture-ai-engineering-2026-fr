[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "Dépôt des exercices et devoirs AIE2026 (développer un agent d’aide à l’apprentissage)"
readme = "README.md"
requires-python = ">=3.12"
# Verrouiller les versions pour préserver le fonctionnement pendant l’année
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp sert dans Lecture 05 (serveur et client MCP)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
